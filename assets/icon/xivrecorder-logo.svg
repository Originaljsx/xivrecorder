<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#2f7fd8"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6fd6"/>
      <stop offset="1" stop-color="#22307a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6fbff"/>
      <stop offset="1" stop-color="#8fd8ff"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#d9361c"/>
    </radialGradient>
  </defs>
  <!-- Crystal: an elongated octahedron seen from the front. -->
  <g transform="translate(236 256)">
    <polygon points="0,-216 -116,-40 0,0" fill="url(#top)"/>
    <polygon points="0,-216 116,-40 0,0" fill="#5aa8ee"/>
    <polygon points="-116,-40 0,0 0,224" fill="url(#left)"/>
    <polygon points="116,-40 0,0 0,224" fill="url(#right)"/>
    <polyline points="0,-216 -116,-40 0,224 116,-40 0,-216" fill="none" stroke="#0e1a3d" stroke-width="10" stroke-linejoin="round"/>
    <polyline points="-116,-40 0,0 116,-40" fill="none" stroke="#0e1a3d" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/>
    <line x1="0" y1="-216" x2="0" y2="224" stroke="#0e1a3d" stroke-opacity="0.25" stroke-width="5"/>
  </g>
  <!-- Record dot. -->
  <circle cx="392" cy="384" r="92" fill="#0e1a3d"/>
  <circle cx="392" cy="384" r="76" fill="url(#dot)"/>
  <circle cx="392" cy="384" r="76" fill="none" stroke="#ffffff" stroke-width="12"/>
</svg>
